version: "3.9"

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/leadflow
      DIRECT_URL: postgresql://postgres:password@db:5432/leadflow
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: leadflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ..:/app
    command: sh -c "npm install --ignore-scripts && npx prisma migrate deploy"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/leadflow
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - migrate

volumes:
  postgres_data:
