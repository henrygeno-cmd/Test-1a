name: CI

on:
  push:
    branches: [main, develop, "claude/**"]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    env:
      DATABASE_URL: "postgresql://postgres:password@localhost:5432/contentforge"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "ci-secret-not-real"
      OPENAI_API_KEY: "sk-not-real"
      STRIPE_SECRET_KEY: "sk_test_not_real"
      STRIPE_PUBLISHABLE_KEY: "pk_test_not_real"
      STRIPE_WEBHOOK_SECRET: "whsec_not_real"
      STRIPE_STARTER_PRICE_ID: "price_starter"
      STRIPE_PRO_PRICE_ID: "price_pro"
      STRIPE_AGENCY_PRICE_ID: "price_agency"
      EMAIL_FROM: "noreply@example.com"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build application
        run: npm run build
